# ==============================================================================
# Google Cloud Build Pipeline for Opticom Finance House (OFL) Credit Platform
# Target: Google Cloud Run & Cloud SQL (PostgreSQL 16)
# ==============================================================================

steps:
  # Step 1: Run automated backend acceptance tests
  - name: 'python:3.13-slim'
    id: 'run-unit-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r backend/requirements.txt
        python -m pytest -v backend/tests

  # Step 2: Build container image with Docker
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/ofl-platform:$BUILD_ID'
      - '-t'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/ofl-platform:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Step 3: Push container image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/ofl-platform:$BUILD_ID'

  # Step 4: Deploy service to Google Cloud Run attached to Cloud SQL PostgreSQL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/ofl-platform:$BUILD_ID'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'ofl-app-runner@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:$_REGION:$_CLOUDSQL_INSTANCE'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,YOUVERIFY_API_KEY=YOUVERIFY_API_KEY:latest,YOUVERIFY_WEBHOOK_SECRET=YOUVERIFY_WEBHOOK_SECRET:latest,WEBHOOK_SECRET=WEBHOOK_SECRET:latest'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,DEBUG=false,GCP_PROJECT_ID=$PROJECT_ID,GCP_LOCATION=$_REGION,VERTEX_AI_MODEL=gemini-1.5-pro,GCS_BUCKET_NAME=$_GCS_BUCKET,GCP_SECRET_MANAGER_ENABLED=true,GCP_CLOUD_LOGGING_ENABLED=true,GCS_LOCAL_EMULATOR=false,MOCK_YOUVERIFY_SANDBOX=false'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'

substitutions:
  _AR_LOCATION: 'europe-west1'
  _AR_REPO: 'ofl-containers'
  _SERVICE_NAME: 'ofl-credit-platform'
  _REGION: 'europe-west1'
  _GCS_BUCKET: 'opticom-ofl-platform-docs'
  _CLOUDSQL_INSTANCE: 'ofl-postgres-prod'

images:
  - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/ofl-platform:$BUILD_ID'
  - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/ofl-platform:latest'

options:
  logging: CLOUD_LOGGING_ONLY
